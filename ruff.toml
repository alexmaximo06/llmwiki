target-version = "py311"
line-length = 120
extend-exclude = [".venv", "venv", "node_modules", "scripts", "wiki", "emails", "supabase"]

[lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes — unused imports/vars, undefined names
  "I",    # isort — import order
  "UP",   # pyupgrade — X | None, modern syntax
  "B",    # bugbear — real bugs
  "SIM",  # flake8-simplify — flatten/dedupe control flow
  "RET",  # flake8-return — no else after return
  "C90",  # mccabe — complexity (short methods)
  "BLE",  # blind-except — bare `except Exception`
]
ignore = [
  "E501",    # line length — long SQL strings; soft
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "SIM108",  # ternary-over-if often reads worse
  "RET504",  # assign-then-return is sometimes clearer
]

[lint.mccabe]
max-complexity = 12

[lint.per-file-ignores]
"tests/**" = ["B", "C90", "BLE"]
# Sentry/Logfire must configure before route modules import.
"api/main.py" = ["E402"]
# C901 refactor backlog — remove an entry once its functions are decomposed.
"api/html_parser/parser.py" = ["C90"]
"api/domain/local_processor.py" = ["C90"]
"api/infra/tus.py" = ["C90"]
"api/services/local.py" = ["C90"]
"api/services/references.py" = ["C90"]
"mcp/tools/list.py" = ["C90"]
"mcp/tools/references.py" = ["C90"]
